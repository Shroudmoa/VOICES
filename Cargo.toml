[package]
name = "voices"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A focused terminal reader that speaks: offline neural TTS with live word highlighting"
authors = ["you"]
license = "MIT"
readme = "README.md"

[[bin]]
name = "voices"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.10"
toml = "0.8"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
